<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-label="Animated deployment terminal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9945FF"/><stop offset="100%" stop-color="#14F195"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9945FF"/><stop offset="100%" stop-color="#14F195"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
text{font-family:'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace;font-size:15px}
@keyframes l0{0%,4%{opacity:0;transform:translateX(-10px)}7%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}.l0{animation:l0 14s ease-out infinite}@keyframes l1{0%,18%{opacity:0;transform:translateX(-10px)}21%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}.l1{animation:l1 14s ease-out infinite}@keyframes l2{0%,32%{opacity:0;transform:translateX(-10px)}35%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}.l2{animation:l2 14s ease-out infinite}@keyframes l3{0%,46%{opacity:0;transform:translateX(-10px)}49%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}.l3{animation:l3 14s ease-out infinite}@keyframes l4{0%,60%{opacity:0;transform:translateX(-10px)}63%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}.l4{animation:l4 14s ease-out infinite}@keyframes l5{0%,74%{opacity:0;transform:translateX(-10px)}77%,93%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}.l5{animation:l5 14s ease-out infinite}
@keyframes bar{0%{width:0}90%,100%{width:720px}}
.bar{animation:bar 14s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
.glow{animation:pulse 4s ease-in-out infinite}
</style>

<rect x="2" y="2" width="796" height="336" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect class="glow" x="2" y="2" width="796" height="336" rx="14" fill="none" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/>

<rect x="2" y="2" width="796" height="40" rx="14" fill="#161b22"/>
<rect x="2" y="28" width="796" height="14" fill="#161b22"/>
<circle cx="28" cy="22" r="6" fill="#ff5f56"/><circle cx="50" cy="22" r="6" fill="#ffbd2e"/><circle cx="72" cy="22" r="6" fill="#27c93f"/>
<text x="400" y="27" text-anchor="middle" fill="#8b949e" style="font-size:13px">arafat@deploy ~ ship-it</text>

<g class="l0"><text x="40" y="108" fill="#14F195">$</text><text x="62" y="108" fill="#e6edf3">git push origin main</text></g><g class="l1"><text x="40" y="142" fill="#9945FF">></text><text x="62" y="142" fill="#e6edf3">GitHub Actions</text><text x="300" y="142" fill="#8b949e">build passed</text><text x="640" y="142" fill="#14F195">[OK]</text></g><g class="l2"><text x="40" y="176" fill="#9945FF">></text><text x="62" y="176" fill="#e6edf3">Vercel</text><text x="300" y="176" fill="#8b949e">frontend deployed</text><text x="640" y="176" fill="#14F195">[OK]</text></g><g class="l3"><text x="40" y="210" fill="#9945FF">></text><text x="62" y="210" fill="#e6edf3">Render</text><text x="300" y="210" fill="#8b949e">backend API live</text><text x="640" y="210" fill="#14F195">[OK]</text></g><g class="l4"><text x="40" y="244" fill="#9945FF">></text><text x="62" y="244" fill="#e6edf3">Cloudinary</text><text x="300" y="244" fill="#8b949e">media synced</text><text x="640" y="244" fill="#14F195">[OK]</text></g><g class="l5"><text x="40" y="284" fill="#FFD43B">*</text><text x="62" y="284" fill="url(#g)">Shipped to production. Let's build something awesome!</text></g>

<text class="cur" x="40" y="318" fill="#14F195">_</text>

<rect x="40" y="326" width="720" height="4" rx="2" fill="#21262d"/>
<rect class="bar" x="40" y="326" width="0" height="4" rx="2" fill="url(#bar)"/>
</svg>
